@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F0F2EE; --surface:#FFFFFF; --surface-2:#E3E8E3; --line:#D2DAD4;
    --fg:#14201C; --muted:#56655F; --accent:#5C3D01; --accent-text:#6A4604; --on-accent:#FFFFFF;
    --good:#1E8A5C; --warn:#A06A00; --danger:#C23B2E;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F0F2EE; --surface:#FFFFFF; --surface-2:#E3E8E3; --line:#D2DAD4;
    --fg:#14201C; --muted:#56655F; --accent:#5C3D01; --accent-text:#6A4604; --on-accent:#FFFFFF;
    --good:#1E8A5C; --warn:#A06A00; --danger:#C23B2E;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E1A17; --surface:#14241F; --surface-2:#1B2E29; --line:#263C36;
    --fg:#ECEFEA; --muted:#93A39D; --accent:#C8893D; --accent-text:#DDA25A; --on-accent:#1A1003;
    --good:#5FD3A8; --warn:#F2B441; --danger:#FF7A6B;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ol,ul{margin:0;padding:0;list-style:none}

.display{font-family:var(--font-display);font-stretch:118%;font-weight:800;letter-spacing:-.01em;line-height:1.02}
.label{font-family:var(--font-display);font-stretch:70%;font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:22px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand{align-items:center}
.brand .rune{width:17px;height:28px;flex:none;background:var(--accent-text);-webkit-mask:var(--rune) center/contain no-repeat;mask:var(--rune) center/contain no-repeat}
.brand b{display:block;width:92px;height:19px;background:var(--fg);-webkit-mask:var(--wordmark) left center/contain no-repeat;mask:var(--wordmark) left center/contain no-repeat;font-size:0}
.brand span{font-size:13px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}

.page-title{font-size:34px}
.page-head{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.page-head p{color:var(--muted)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 14px;border-radius:var(--r-md);background:var(--surface);border:1px dashed var(--line);font-size:13px;color:var(--muted)}
.banner button{flex:none;font-weight:600;color:var(--accent-text);padding:6px 8px}

/* Hero: próximo treino */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);background:var(--accent);color:var(--on-accent);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;background:
  radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--on-accent) 20%,transparent),transparent 55%),
  repeating-linear-gradient(-28deg,color-mix(in srgb,var(--on-accent) 5%,transparent) 0 2px,transparent 2px 9px)}
.hero-mark{position:absolute;right:-18px;top:-14px;width:150px;height:240px;z-index:-1;background:var(--on-accent);opacity:.16;-webkit-mask:var(--rune) center/contain no-repeat;mask:var(--rune) center/contain no-repeat;pointer-events:none;font-size:0}
.hero .label{color:color-mix(in srgb,var(--on-accent) 78%,transparent)}
.hero-title{font-size:38px;max-width:12ch}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px}
.hero-meta span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--on-accent) 16%,transparent)}
.hero-list{display:flex;flex-direction:column;gap:2px;font-size:14px}
.hero-list li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--on-accent) 18%,transparent)}
.hero-list li:last-child{border-bottom:0}
.hero-list .num{opacity:.85;flex:none}
.btn-start{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 18px;border-radius:18px;background:var(--on-accent);color:var(--accent);font-family:var(--font-display);font-stretch:112%;font-weight:800;font-size:17px;transition:transform .15s}
.btn-start:active{transform:scale(.98)}
.btn-start svg{width:22px;height:22px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-title{font-family:var(--font-display);font-stretch:112%;font-weight:800;font-size:19px}
.link{color:var(--accent-text);font-weight:600;font-size:14px}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.dot svg{width:16px;height:16px}
.day.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.today{color:var(--fg);font-weight:700}
.day.today .dot{border-color:var(--fg)}
.day.future .dot{border-style:dashed;opacity:.6}
.goal-line{display:flex;align-items:center;gap:12px}
.mini-ring{width:46px;height:46px;flex:none}
.goal-line strong{font-family:var(--font-display);font-stretch:112%;font-weight:800;font-size:18px;display:block;line-height:1.1}
.goal-line span{font-size:13px;color:var(--muted)}

.stat-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-family:var(--font-display);font-stretch:118%;font-weight:800;font-size:30px;line-height:1}
.stat small{font-size:13px;color:var(--muted)}

.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item .title{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .sub{font-size:13px;color:var(--muted)}
.list-item .end{flex:none;text-align:right;font-size:13px;color:var(--muted)}
.thumb{width:52px;height:52px;flex:none;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}

.pill.rpe-hi{color:var(--danger)}
.pill.rpe-mid{color:var(--warn)}
.pill.rpe-lo{color:var(--good)}

/* Chips e busca */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}

.levels{display:inline-flex;gap:3px;align-items:flex-end}
.levels i{display:block;width:5px;border-radius:2px;background:var(--line)}
.levels i:nth-child(1){height:7px}.levels i:nth-child(2){height:11px}.levels i:nth-child(3){height:15px}
.levels i.on{background:var(--accent-text)}

/* Programas */
.prog-grid{display:flex;flex-direction:column;gap:12px}
.prog{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;position:relative}

.prog h3{font-family:var(--font-display);font-stretch:118%;font-weight:800;font-size:22px}
.prog p{color:var(--muted);font-size:14px}
.prog-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);align-items:center}
.prog-meta b{color:var(--fg);font-weight:600}
.badge{position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:99px;background:var(--accent);color:var(--on-accent)}

/* Progresso */
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:12px}
.heat-col{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat-cell{aspect-ratio:1;max-width:100%;border-radius:4px;background:var(--surface-2)}
.heat-cell.on{background:var(--accent)}
.heat-cell.today{box-shadow:inset 0 0 0 2px var(--fg)}
.heat-cell.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}

/* Barra de abas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] .tab-ic{background:var(--surface-2)}
.tab-ic{padding:3px 16px;border-radius:99px;display:grid;place-items:center;transition:background .2s}

/* Folha (bottom sheet) */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,7,10,.55);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:560px;max-height:90%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;border:1px solid var(--line);border-bottom:0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-body{display:flex;flex-direction:column;gap:18px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-head h2{font-size:28px}
.fig-stage{border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;overflow:hidden}
.fig-stage svg{height:100%;width:auto;max-width:100%}
.meta-row{display:flex;flex-wrap:wrap;gap:8px}
.meta-row .pill{font-weight:600;padding:5px 10px}
.steps{display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--font-display)}
.warn-box{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);font-size:14px}
.warn-box svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:2px}
.ladder{display:flex;flex-direction:column;gap:0;position:relative}
.rung{display:flex;align-items:center;gap:12px;padding:8px 0;text-align:left;width:100%;position:relative}
.rung::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--line)}
.rung:first-child::before{top:50%}
.rung:last-child::before{bottom:50%}
.rung i{position:relative;width:24px;height:24px;border-radius:50%;background:var(--bg);border:2px solid var(--line);flex:none}
.rung.past i{background:var(--surface-2)}

.rung.cur span{font-weight:700}
.rung span{font-size:14px}
.rung small{margin-left:auto;color:var(--muted);font-size:12px}
.sess{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.sess-items{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.sess-items li{display:flex;justify-content:space-between;gap:10px}
.sess-items li span:first-child{color:var(--fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:16px;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.small{height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .label{font-size:13px}
.text-input{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:22px;font-weight:600}
.stepper output{font-family:var(--font-display);font-stretch:112%;font-weight:800;font-size:24px;min-width:3ch;text-align:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg button{height:40px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:52px;height:32px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-accent)}

/* Player */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.player-inner{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.p-top{display:flex;align-items:center;gap:12px}
.p-top .grow{flex:1;min-width:0}
.p-top .grow b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-top .grow span{font-size:13px;color:var(--muted)}

.segs i{flex:1;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative}

.segs i.cur::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--accent)}
.p-main{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto}
.p-fig{flex:1;min-height:150px;max-height:300px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}
.p-fig svg{height:100%;width:auto;max-width:100%}
.p-fig .set-tag{position:absolute;left:14px;top:12px}
.p-name{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.p-name h2{font-size:30px}
.p-cue{color:var(--muted);font-size:15px}
.counter{display:flex;align-items:center;justify-content:center;gap:22px}
.counter button{width:58px;height:58px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:28px;font-weight:500}
.counter .big{font-family:var(--font-display);font-stretch:125%;font-weight:900;font-size:96px;line-height:.9;min-width:2ch;text-align:center}
.counter-cap{text-align:center;font-size:13px;color:var(--muted);margin-top:-6px}
.ring-wrap{position:relative;width:min(62vw,250px);aspect-ratio:1;max-width:100%;margin:0 auto}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap .ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-c b{font-family:var(--font-display);font-stretch:125%;font-weight:900;font-size:64px;line-height:1}
.ring-c span{font-size:13px;color:var(--muted)}
.ring-track{stroke:var(--surface-2)}
.ring-bar{stroke:var(--accent);transition:stroke-dashoffset .2s linear}
.ring-bar.rest{stroke:var(--good)}
.next-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.next-card .grow{flex:1;min-width:0}
.p-actions{display:flex;flex-direction:column;gap:10px}
.prep{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);font-family:var(--font-display);font-stretch:125%;font-weight:900;font-size:120px}
.summary-hero{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.summary-hero h2{font-size:40px}
.stat-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--font-display);font-weight:800;font-size:16px}
.rpe button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pr-list li{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.pr-list svg{width:18px;height:18px;color:var(--warn);flex:none}

.confirm{position:absolute;inset:0;z-index:5;display:grid;place-items:end center;background:rgba(5,7,10,.6);padding:16px}
.confirm-box{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

.btn:disabled{opacity:.4;cursor:default}
.plan-cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--accent)}

.plan-cta svg{width:22px;height:22px;color:var(--accent-text);flex:none}
.swap-row{display:flex;gap:8px}
.swap-row .btn{flex:1}

.onb-main{gap:16px;padding-top:6px}
.onb-progress{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}

.opts{display:flex;flex-direction:column;gap:10px}

.opt b{display:block;font-weight:700}
.opt small{display:block;color:var(--muted);font-size:13px}

.opt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.days{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.days .opt{flex-direction:column;justify-content:center;padding:18px 0;gap:0;text-align:center}
.days .opt b{font-family:var(--font-display);font-stretch:125%;font-weight:900;font-size:36px;line-height:1}
.adj li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.adj li:last-child{border-bottom:0}
.adj svg{width:16px;height:16px;color:var(--muted);flex:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

      const d = new Date(ws.getTime() - w*7*DAY + off*DAY); d.setHours(18, 20 + Math.floor(rnd()*30));

      const sets = [];
      sess.items.forEach(([ex, ns, tg]) => {
        for (let i=0;i<ns;i++){

          const v = e.t === 'time' ? tg : Math.max(1, tg - 3 + Math.floor(wk/2) + (i===ns-1 ? -1 : 0) + (rnd() > .7 ? 1 : 0));

function eqOk(q){
  const eq = S.assess ? S.assess.eq : null;

  const L = ladderOf(id); let i = L.findIndex(x => x.id === id) + dir;

function computeSwaps(a){
  const hasBanco = a.eq.includes('banco');
  const lv = a.lv;
  const caps = {
    flexao: [hasBanco ? 1 : 0, 2, 3, 4, 5][a.push],
    barra: a.eq.includes('barra') ? [2, 3, 4, 5][a.pull] : null,

  const prev = S.assess; S.assess = a; /* eqOk/canDo leem o equipamento da avaliação */
  const used = new Set(PROGRAMS.flatMap(p => p.sessions.flatMap(s => s.items.map(i => i[0]))));
  const out = {};
  used.forEach(id => {

      if (cap != null && e.step > cap){ t = ladderOf(t).find(x => x.step === cap).id; continue; }

function recommend(a){
  const hasBar = a.eq.includes('barra');

    else { pid = 'primeira_barra'; why = 'Pegada, remadas e negativas lentas: a sequência mais direta até a primeira barra completa.'; }

  else if (a.goal === 'cond'){ pid = a.lv === 1 ? 'express15' : 'explosao'; why = a.lv === 1 ? 'Circuitos curtos e sem saltos para ganhar fôlego com segurança.' : 'Você tem base de força. Circuitos com saltos vão puxar o condicionamento.'; }
  else if (a.goal === 'skills'){

    else if (hasBar && a.lv === 2){ pid = 'forca_total'; why = 'Habilidades pedem uma base maior: 10 barras e 25 flexões. Este programa constrói essa base.'; }
    else { pid = a.push === 0 ? 'primeira_flexao' : 'base8'; why = 'Antes das habilidades, construa força de empurrar, puxar e core. Refaça a avaliação em algumas semanas.'; }
  }
  else {

    else if (hasBar){ pid = 'forca_total'; why = 'Você tem base e barra fixa. Dividir superior e inferior permite mais volume por grupo.'; }
    else { pid = 'explosao'; why = 'Sem barra, potência e volume alto com o peso do corpo trazem o próximo ganho de força.'; }
  }
  return {pid, why};
}

function estMinutes(sess){
  let s = 0;
  sess.items.forEach(([ex, n, tg, rest]) => { const work = EX[ex].t === 'time' ? tg : tg*3.2*(EX[ex].side?2:1); s += n*work + (n)*rest; });
  return Math.round(s/60);
}
function nextSession(pid){
  const p = PROG[pid], done = S.progress[pid] || 0;
  return {idx: done % p.sessions.length, sess: p.sessions[done % p.sessions.length], week: Math.min(p.weeks, Math.floor(done / p.days) + 1)};
}
function weeklyReps(n){
  const out = [];
  for (let w = n-1; w >= 0; w--){
    const list = sessionsInWeek(w);
    const v = list.reduce((a,h) => a + h.sets.reduce((b,[ex,val]) => b + (EX[ex] && EX[ex].t === 'reps' ? val : 0), 0), 0);
    const ws = new Date(weekStart(new Date()).getTime() - w*7*DAY);
    out.push({label: `${ws.getDate()}/${ws.getMonth()+1}`, v});
  }
  return out;
}

function exMatches(e){

  if (!exQuery) return true;
  const q = exQuery.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  return e.n.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().includes(q);
}

function barChart(data){
  const W = 320, H = 150, pl = 30, pr = 6, pt = 16, pb = 22;
  const max = Math.max(10, ...data.map(d => d.v));
  const step = max <= 60 ? 20 : max <= 150 ? 50 : max <= 400 ? 100 : 250;
  const top = Math.ceil(max/step)*step;
  const iw = W - pl - pr, ih = H - pt - pb, bw = iw / data.length;
  const y = v => pt + ih - (v/top)*ih;
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v? 'stroke-dasharray="2 4"':''}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  const bars = data.map((d,i) => {
    const x = pl + i*bw + bw*.18, w = bw*.64, last = i === data.length-1;
    return `<rect x="${x}" y="${y(d.v)}" width="${w}" height="${Math.max(0, pt+ih-y(d.v))}" rx="4" fill="${last ? 'var(--accent)' : 'var(--surface-2)'}"/>
      ${last && d.v ? `<text x="${x+w/2}" y="${y(d.v)-5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fg)">${d.v}</text>` : ''}
      <text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.label}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Repetições por semana">${g}${bars}</svg>`;
}
function vProgresso(){
  const now = new Date(), todayK = dkey(now), ws = weekStart(now);
  const done = new Set(S.history.map(h => dkey(h.d)));
  let heat = '';
  for (let w = 11; w >= 0; w--){
    let col = '';
    for (let d = 0; d < 7; d++){
      const day = new Date(ws.getTime() - w*7*DAY + d*DAY), k = dkey(day);
      col += `<span class="heat-cell ${done.has(k)?'on':''} ${k===todayK?'today':''} ${day>now&&k!==todayK?'future':''}" title="${day.getDate()}/${day.getMonth()+1}"></span>`;
    }
    heat += `<div class="heat-col">${col}</div>`;
  }
  const mins = Math.round(S.history.reduce((a,h) => a+h.dur, 0)/60);
  const last5 = S.history.slice(-5), rpeAvg = last5.length ? (last5.reduce((a,h)=>a+h.rpe,0)/last5.length).toFixed(1).replace('.',',') : '–';
  const rec = Object.entries(records()).sort((a,b) => (EX[b[0]].t==='reps') - (EX[a[0]].t==='reps') || b[1].v - a[1].v).slice(0,6);
  return `<div class="view">
    <div class="page-head"><h1 class="page-title display">Progresso</h1><p>Tudo fica salvo só neste aparelho.</p></div>
    <div class="stat-pair">
      <div class="stat"><span class="label">Treinos</span><b class="num">${S.history.length}</b><small>no total</small></div>
      <div class="stat"><span class="label">Minutos</span><b class="num">${mins}</b><small>de treino</small></div>
      <div class="stat"><span class="label">Sequência</span><b class="num">${streak()}</b><small>semanas na meta</small></div>
      <div class="stat"><span class="label">Esforço</span><b class="num">${rpeAvg}</b><small>RPE médio, últimos 5</small></div>
    </div>
    <section class="card"><div class="row-between"><h2 class="section-title">Frequência</h2><span class="label">12 semanas</span></div>
      <div class="heat" aria-label="Dias com treino nas últimas 12 semanas">${heat}</div>
      <div class="legend"><span>seg no topo, dom embaixo</span><span>hoje com contorno</span></div></section>
    <section class="card"><div class="row-between"><h2 class="section-title">Repetições por semana</h2><span class="label">8 semanas</span></div>${barChart(weeklyReps(8))}</section>
    <section><h2 class="section-title">Recordes</h2>
      ${rec.length ? `<div class="list">${rec.map(([ex,r]) => `<button class="list-item" data-act="open-ex" data-id="${ex}"><span class="thumb">${figSVG(EX[ex].a,.5,{thin:true})}</span><span class="grow"><span class="title">${esc(EX[ex].n)}</span><span class="sub">melhor série</span></span><span class="end"><b class="display num" style="font-size:22px;color:var(--fg)">${fmtTarget(ex,r.v)}</b></span></button>`).join('')}</div>` : '<div class="empty" style="margin-top:10px">Conclua um treino para ver seus recordes.</div>'}
    </section>
    <section><h2 class="section-title">Histórico</h2>
      ${S.history.length ? `<div class="list">${S.history.slice().reverse().slice(0,20).map(histRow).join('')}</div>` : '<div class="empty" style="margin-top:10px">Nenhum treino ainda.</div>'}
    </section>
  </div>`;
}

function beep(f=880, ms=120){
  if (!S.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f; o.type = 'sine'; g.gain.value = .0001;
    o.connect(g); g.connect(audio.destination);
    const t = audio.currentTime; g.gain.exponentialRampToValueAtTime(.25, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+ms/1000);
    o.start(t); o.stop(t + ms/1000 + .02);
  } catch(e){}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };

function startSession(pid, si){
  const p = PROG[pid], sess = p.sessions[si], steps = [];
  sess.items.forEach(([orig,n,tg,rest], xi) => {
    const ex = resolveEx(orig), t = EX[ex].t === EX[orig].t ? tg : EX[ex].tg;
    for (let i=0;i<n;i++) steps.push({orig, ex, set:i+1, of:n, tg:t, base:tg, rest, xi});
  });
  P = {pid, si, sess, steps, i:0, phase:'work', value:steps[0].tg, running:false, end:0, left:steps[0].tg, prep:0, log:[], start:Date.now(), confirm:false, rpe:7};
  closeSheet();
  playerEl.hidden = false; document.body.style.overflow = 'hidden';
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(() => {}); } catch(e){}
  beep(660, 60);
  renderPlayer();
  clearInterval(tickId); tickId = setInterval(tick, 200);
}
function endPlayer(){
  clearInterval(tickId); tickId = null; P = null;
  playerEl.hidden = true; playerEl.innerHTML = ''; document.body.style.overflow = '';
  try { wakeLock && wakeLock.release(); } catch(e){} wakeLock = null;
}
const cur = () => P.steps[P.i];
function segsHTML(){
  const n = P.sess.items.length, xi = P.phase === 'done' ? n : cur().xi;
  return `<div class="segs" aria-hidden="true">${P.sess.items.map((it,i) => {
    if (i < xi) return '<i class="done"></i>';
    if (i === xi){ const st = cur(); const pct = ((st.set - 1) / st.of)*100; return `<i class="cur" style="--p:${pct}%"></i>`; }
    return '<i></i>';
  }).join('')}</div>`;
}
function ringSVG(id, frac, rest){
  const C = 2*Math.PI*90;
  return `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" class="ring-track" stroke-width="10"/><circle id="${id}" cx="100" cy="100" r="90" fill="none" class="ring-bar ${rest?'rest':''}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg>`;
}
function renderPlayer(){

  let body = '';
  if (P.phase === 'done') body = summaryHTML();
  else if (P.phase === 'rest'){
    const nx = P.steps[P.i+1], e = EX[nx.ex];
    body = `<div class="p-main">
      <p class="label" style="text-align:center;margin-top:8px">Descanso</p>
      <div class="ring-wrap">${ringSVG('pRing', P.left/cur().rest, true)}<div class="ring-c"><b id="pLeft" class="num">${mmss(P.left)}</b><span>respire fundo</span></div></div>

    } else {
      body = `<div class="p-main"><div class="p-fig" data-fig="${e.a}" style="max-height:200px"></div>${head}
        <div class="ring-wrap" style="width:min(52vw,210px)">${ringSVG('pRing', P.left/st.tg, false)}<div class="ring-c"><b id="pLeft" class="num">${mmss(P.left)}</b><span>${P.running ? 'segure' : 'pronto?'}</span></div>${P.prep ? `<div class="prep num" id="pPrep">${P.prep}</div>` : ''}</div></div>
        <div class="p-actions">${P.running || P.prep ? `<button class="btn block" data-act="p-pause">Pausar</button><button class="btn ghost block small" data-act="p-finish">Concluir agora</button>` : `<button class="btn primary block" data-act="p-go">${P.left < st.tg ? 'Continuar' : 'Iniciar'}</button><button class="btn ghost block small" data-act="p-skip">Pular exercício</button>`}</div>`;

function tick(){
  if (!P) return;
  const el = document.getElementById('pElapsed'); if (el) el.textContent = mmss((Date.now()-P.start)/1000);
  if (P.phase === 'done') return;
  const now = Date.now();
  if (P.prep){
    const n = Math.ceil((P.prepEnd - now)/1000);
    if (n <= 0){ P.prep = 0; P.running = true; P.end = now + P.left*1000; beep(1046, 180); renderPlayer(); return; }
    if (n !== P.prep){ P.prep = n; beep(740, 80); const pe = document.getElementById('pPrep'); if (pe) pe.textContent = n; }
    return;
  }
  if (!P.running && P.phase !== 'rest') return;
  const left = Math.max(0, (P.end - now)/1000), prev = Math.ceil(P.left);
  P.left = left;
  const total = P.phase === 'rest' ? cur().rest : cur().tg;
  const C = 2*Math.PI*90, ring = document.getElementById('pRing'), lt = document.getElementById('pLeft');
  if (ring) ring.style.strokeDashoffset = C*(1 - left/total);
  if (lt) lt.textContent = mmss(left);
  const c = Math.ceil(left);
  if (c !== prev && c <= 3 && c > 0) beep(740, 80);
  if (left <= 0){
    beep(1046, 260); buzz([120,60,120]);
    if (P.phase === 'rest') nextStep();
    else { P.running = false; logSet(cur().tg); toRest(); }
  }
}
function logSet(v){ P.log.push([cur().ex, v]); }
function toRest(){
  if (P.i >= P.steps.length - 1){ P.phase = 'done'; renderPlayer(); return; }
  const r = cur().rest;
  if (!r){ nextStep(); return; }
  P.phase = 'rest'; P.left = r; P.end = Date.now() + r*1000; renderPlayer();
}
function nextStep(){
  P.i++;
  if (P.i >= P.steps.length){ P.phase = 'done'; renderPlayer(); return; }
  P.phase = 'work'; P.running = false; P.prep = 0; P.value = cur().tg; P.left = cur().tg; renderPlayer();
}
function skipExercise(){
  const xi = cur().xi; let j = P.i;
  while (j < P.steps.length && P.steps[j].xi === xi) j++;
  if (j >= P.steps.length){ P.phase = 'done'; renderPlayer(); return; }
  P.i = j - 1; nextStep();
}
function summaryHTML(){

  const rec = records(), prs = [];

  Object.entries(best).forEach(([ex,v]) => { if (!rec[ex] || v > rec[ex].v) prs.push([ex,v]); });
  const words = {1:'Muito leve',2:'Leve',3:'Leve',4:'Moderado',5:'Moderado',6:'Moderado',7:'Difícil',8:'Difícil',9:'Muito difícil',10:'Máximo'};

  <div class="p-actions"><button class="btn primary block" data-act="p-save">Salvar treino</button><button class="btn ghost block small" data-act="p-discard">Descartar</button></div>`;

  const {a, r, sw} = O.result;
  S.assess = a; S.swap = sw; S.goal = a.days;
  if (S.sample){ S.history = []; S.progress = {}; S.sample = false; }
  if (!browse){ S.active = r.pid; S.progress[r.pid] = S.progress[r.pid] || 0; }
  save(); closeOnb();
  if (browse){ progFilter = 0; go('programas'); toast('Variações ajustadas ao seu nível'); }
  else { go('hoje'); toast(`Plano pronto: ${PROG[r.pid].name}`); }
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch (a){
    case 'tab': closeSheet(); go(b.dataset.tab); break;
    case 'settings': shSettings(); break;
    case 'close-sheet': closeSheet(); break;
    case 'open-ex': shEx(b.dataset.id); break;
    case 'open-prog': shProg(b.dataset.id); break;
    case 'prog-filter': progFilter = +b.dataset.lv; render(); break;
    case 'ex-filter': exFilter = b.dataset.g; render(); break;
    case 'follow': S.active = b.dataset.id; S.progress[S.active] = S.progress[S.active] || 0; save(); closeSheet(); go('hoje'); toast(`Agora você segue ${PROG[S.active].name}`); break;
    case 'start': startSession(b.dataset.prog, +b.dataset.sess); break;
    case 'reset-sample': S.history = []; S.progress = {[S.active]:0}; S.sample = false; save(); render(); toast('Pronto. Seu histórico começa agora.'); break;
    case 'goal': S.goal = Math.min(7, Math.max(1, S.goal + +b.dataset.d)); document.getElementById('goalOut').textContent = S.goal; save(); render(); break;
    case 'theme': S.theme = b.dataset.th; save(); applyTheme(); b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); break;
    case 'sound': S.sound = !S.sound; save(); b.setAttribute('aria-checked', S.sound); break;
    case 'install': if (installPrompt){ installPrompt.prompt(); installPrompt.userChoice.finally(() => { installPrompt = null; closeSheet(); }); } break;
    case 'export': exportData(); break;
    case 'wipe':
      if (Date.now() - wipeArmed < 4000){ try { localStorage.removeItem(KEY); } catch(e){} S = {...seedState(), history:[], progress:{base8:0}, sample:false}; save(); applyTheme(); closeSheet(); go('hoje'); toast('Dados apagados'); }
      else { wipeArmed = Date.now(); b.textContent = 'Toque de novo para confirmar'; setTimeout(() => { if (b.isConnected) b.textContent = 'Apagar todos os dados'; }, 4000); }
      break;
    /* player */
    case 'p-close': P.confirm = true; renderPlayer(); break;
    case 'p-stay': P.confirm = false; renderPlayer(); break;
    case 'p-quit': endPlayer(); break;
    case 'p-inc': P.value = Math.min(999, P.value + 1); document.getElementById('pVal').textContent = P.value; break;
    case 'p-dec': P.value = Math.max(0, P.value - 1); document.getElementById('pVal').textContent = P.value; break;
    case 'p-done': logSet(P.value); buzz(40); toRest(); break;
    case 'p-skip': skipExercise(); break;
    case 'p-swap': {
      const to = b.dataset.to; if (!to) break;
      const orig = cur().orig;
      if (to === orig) delete S.swap[orig]; else S.swap[orig] = to;
      save();
      P.steps.forEach((st, j) => { if (j >= P.i && st.orig === orig){ st.ex = to; st.tg = EX[to].t === EX[orig].t ? st.base : EX[to].tg; } });
      P.running = false; P.prep = 0; P.value = cur().tg; P.left = cur().tg;
      renderPlayer(); toast(`Trocado por ${EX[to].n}`);
      break;
    }
    case 'onb-open': closeSheet(); openOnb(); break;
    case 'onb-close': closeOnb(); break;
    case 'onb-back': O.i = Math.max(0, O.i - 1); renderOnb(); break;
    case 'onb-next': O.i++; renderOnb(); break;
    case 'onb-pick': {
      const k = b.dataset.k, v = b.dataset.v;
      if (k === 'eq'){ O.eq.has(v) ? O.eq.delete(v) : O.eq.add(v); renderOnb(); break; }
      O[k] = isNaN(+v) ? v : +v; O.i++; renderOnb(); break;
    }
    case 'onb-finish': finishOnb(); break;
    case 'onb-browse': finishOnb(true); break;
    case 'p-go': P.prep = 3; P.prepEnd = Date.now() + 3000; beep(740, 80); renderPlayer(); break;
    case 'p-pause': if (P.running) P.left = Math.max(0, (P.end - Date.now())/1000); P.running = false; P.prep = 0; renderPlayer(); break;
    case 'p-finish': { const done = Math.round(cur().tg - (P.running ? Math.max(0,(P.end-Date.now())/1000) : P.left)); P.running = false; P.prep = 0; logSet(Math.max(1, done)); toRest(); break; }
    case 'p-add': P.end += 15000; P.steps[P.i].rest += 15; tick(); break;
    case 'p-next': nextStep(); break;
    case 'p-rpe': P.rpe = +b.dataset.n; renderPlayer(); break;
    case 'p-save': saveWorkout(); break;
    case 'p-discard': P.confirm = true; renderPlayer(); break;
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'exSearch'){ exQuery = ev.target.value.trim(); document.getElementById('exList').innerHTML = exListHTML(); if (reduceMotion) staticFigs(); }
  if (ev.target.id === 'setName'){ S.name = ev.target.value.trim(); save(); }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'setName') render();
  if (ev.target.id === 'importFile' && ev.target.files[0]) importData(ev.target.files[0]);
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!sheet.hidden) closeSheet();
  else if (O) closeOnb();
  else if (P && !P.confirm && P.phase !== 'done'){ P.confirm = true; renderPlayer(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && P && navigator.wakeLock){ navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(() => {}); }
});

/* ---------- Início ---------- */
applyTheme();
const h = (location.hash || '').slice(1);
if (VIEWS[h]) tab = h;
render();
if (!reduceMotion) requestAnimationFrame(animLoop);
</script>
<script>
(() => {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if (!('serviceWorker' in navigator)) return;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
  function offer(worker) {
    if (document.querySelector('.update-bar')) return;
    const bar = document.createElement('div');
    bar.className = 'update-bar';
    bar.innerHTML = '<span>Nova versão disponível</span><button type="button">Atualizar</button>';
    bar.querySelector('button').onclick = () => worker.postMessage('SKIP_WAITING');
    document.body.appendChild(bar);
  }
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
      });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
    }).catch(() => {});
  });
})();
</script>
